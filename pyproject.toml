[project]
name = "syco-assumptions-study"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "anthropic>=0.125,<1",
  "bertopic>=0.16,<0.18",
  "fastcore>=1.7,<2",
  "huggingface-hub>=0.28,<2",
  "llama-cpp-python>=0.3.16,<0.4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openai>=2.54,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=15,<27",
  "pyliwc>=1.5,<2",
  "pyyaml>=6,<7",
  "scipy>=1.11,<2",
  "sentence-transformers>=3,<6",
  "statsmodels>=0.14,<1",
  "torch>=2.3,<3",
  "transformers>=4.56,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false
