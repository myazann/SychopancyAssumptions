schema_version: "1.0"
name: default

# An explicit list is also an explicit *running order*: the scheduler takes
# these in sequence as GPUs free up. Use `models: enabled` instead to select
# every enabled model in config/models.yaml, scheduled largest-first.
models:
  - Qwen3.6-27B
  - Gemma3-12B
  - Llama-3.1-8B
  - Gemma3-27B
  - Qwen3.6-35B-A3B

probe:
  # Paper prompt type: openended | 4dims | supporttypes. See syco/prompts.py.
  kind: openended
  # Applies only to openended; structured probes have 4 or 5 fixed dimensions.
  n_models: 3
  system: ""
  thinking: false

design:
  persona_types: null
  prompt_types: [original_post, flipped_story]
  n_personas: 25
  n_prompts: 20
  n_reps: 1
  include_control: true
  seed: 1000

execution:
  poll_seconds: 2
  wait_report_seconds: 60
  wait_timeout_seconds: null

output:
  results_dir: results
  merge_dir: results/merged
